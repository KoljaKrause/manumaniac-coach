<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Einladung · manumaniac</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .join { max-width: 420px; margin: 12vh auto; padding: 0 22px; display: flex; flex-direction: column; gap: 14px; }
    .join .code { font-size: 34px; background: var(--card); border-radius: 14px; padding: 18px; text-align: center; }
    .join ol { padding-left: 20px; line-height: 1.7; color: var(--muted); }
    .join a.primary { text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <div class="join">
    <span class="wordmark" style="font-size:38px">manu<b>maniac</b></span>
    <h2 style="margin:0">Du wurdest eingeladen 💪</h2>
    <p class="muted" style="margin:0">Dein Coach möchte dich über manumaniac betreuen.</p>
    <div class="code" id="code">…</div>
    <a class="primary" id="open" href="#">In der App öffnen</a>
    <a class="small-btn" id="store" style="text-align:center;text-decoration:none" href="#">App laden</a>
    <ol>
      <li>App laden und öffnen</li>
      <li>Account erstellen, "Ich werde gecoacht" wählen</li>
      <li>Code oben eingeben (oder diesen Link nochmal öffnen)</li>
    </ol>
  </div>
  <script type="module">
    import { APP_STORE_URL } from "./config.js";
    const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
    document.getElementById("code").textContent = code || "–";
    document.getElementById("open").href = "manumaniac://join?code=" + encodeURIComponent(code);
    const s = document.getElementById("store");
    if (APP_STORE_URL) s.href = APP_STORE_URL; else s.style.display = "none";
  </script>
</body>
</html>
